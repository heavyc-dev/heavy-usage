name: release

# Tag-triggered release. Cut a release with:
#   node scripts/bump.js X.Y.Z   (edit CHANGELOG)
#   git commit -am "release: vX.Y.Z"
#   git tag vX.Y.Z && git push && git push --tags
# This workflow then verifies the tag matches the manifests, runs the tests,
# and publishes the GitHub release with auto-generated notes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version sync (tag must match manifests)
        run: node scripts/check-version-sync.js --tag "${GITHUB_REF_NAME}"

      - name: Unit tests
        run: node tests/run.js

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
