name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check scripts
        run: node -e "const fs=require('fs'),cp=require('child_process');for(const f of fs.readdirSync('scripts').filter(f=>f.endsWith('.js')))cp.execFileSync(process.execPath,['--check','scripts/'+f],{stdio:'inherit'});console.log('all scripts ok')"

      - name: Unit tests
        run: node tests/run.js

      - name: Manifest JSON parses
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"

      - name: Validate plugin (best-effort)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code && claude plugin validate .
